server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Text travels compressed; images, videos and fonts are already small.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml text/markdown application/json application/javascript application/xml image/svg+xml;

    # Vite names its bundles and fonts after their content: cache them for good.
    location ~* ^/assets/.+-[A-Za-z0-9_-]+\.(js|css|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Screenshots and videos copied from the app by `npm run media`: same names after each
    # refresh, so a short life.
    location ^~ /media/ {
        expires 1d;
        try_files $uri =404;
    }

    location ~* \.(png|ico|svg|webp|jpg|jpeg|mp4|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    location = /robots.txt  { expires 1d; }
    location = /sitemap.xml { expires 1d; }
    location = /llms.txt    { expires 1d; charset utf-8; }

    # The Markdown copies of the help and legal pages (nginx knows no type for .md).
    location ~* \.md$ {
        types { text/markdown md; }
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        expires 1d;
        try_files $uri =404;
    }

    # The addresses the legal pages had before, still linked from the apps and the stores.
    location = /privacy-policies   { return 301 /legal/privacy; }
    location = /terms-of-use       { return 301 /legal/terms; }
    location = /ios/terms-of-use   { return 301 /legal/terms; }

    # Every page is prerendered at build time as <path>/index.html (`/fr/support` is
    # fr/support/index.html). Anything else gets app.html, the bare application, which shows
    # the not-found page.
    location / {
        expires -1;
        try_files $uri $uri/index.html /app.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
